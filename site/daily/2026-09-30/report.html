    "glossary": {
      "id": "glossary",
      "status": "reviewed",
      "rows": [
        {
          "term": "PMI",
          "id": "pmi",
          "short": "采购经理指数",
          "definition": "通过采购经理月度调查形成的景气指数。高于50表示总体较上月扩张，低于50表示收缩。",
          "analogy": "像经济活动的月度温度计，记录企业反馈的变化方向。",
          "misconception": "50.1不是经济增长了50.1%；9月调查也不能证明9月底刚公布政策已经生效。",
          "sourceIds": [
            "nbs-pmi-0926"
          ]
        },
        {
          "term": "PSL",
          "id": "psl",
          "short": "抵押补充贷款",
          "definition": "央行向政策性银行提供的资金工具，用于支持指定领域。",
          "analogy": "像给承担特定项目的机构一条专用融资通道。",
          "misconception": "PSL降息不等于所有人的存款、房贷利率同步下降。",
          "sourceIds": [
            "pboc-20260929"
          ]
        },
        {
          "term": "再贷款",
          "id": "relending",
          "short": "央行向金融机构提供的贷款",
          "definition": "央行向金融机构提供资金，部分工具用于引导银行向指定领域贷款。",
          "analogy": "银行向上游融资，再为符合条件的企业提供贷款。",
          "misconception": "资金支持不是补贴本金；企业需要还款，银行仍要评估和承担相应信用风险。",
          "sourceIds": [
            "pboc-tools",
            "pboc-20260929"
          ]
        },
        {
          "term": "基点",
          "id": "basis-point",
          "short": "Basis point，BP",
          "definition": "1个基点等于0.01个百分点；25个基点等于0.25个百分点。",
          "analogy": "就像用厘米描述一小段距离，基点用来描述细小的利率变化。",
          "misconception": "1.75%降至1.50%是下降25个基点，不是下降25%。",
          "sourceIds": []
        },
        {
          "term": "额度",
          "id": "quota",
          "short": "政策工具的可用规模",
          "definition": "某项工具可使用的规模上限；实际用出去多少，要看执行数据。",
          "analogy": "获批的预算，不等于已经付款的账单。",
          "misconception": "额度增加2000亿元，不等于当天新增贷款或到账资金就有2000亿元。",
          "sourceIds": [
            "pboc-20260929"
          ]
        },
        {
          "term": "PCE价格指数",
          "id": "pce",
          "short": "个人消费支出价格指数",
          "definition": "衡量美国居民购买商品和服务价格变化的指标。核心PCE剔除食品和能源。",
          "analogy": "跟踪一篮子生活开支的价格，而不是只看今天买的一件商品。",
          "misconception": "PCE支出金额与PCE价格指数不同；涨价放慢，也不一定意味着价格下降。",
          "sourceIds": [
            "bea-pce"
          ]
        },
        {
          "term": "非农就业",
          "id": "nonfarm",
          "short": "美国非农就业岗位统计",
          "definition": "统计美国非农单位的有薪岗位；常说的新增非农，是岗位总量的月度净变化。",
          "analogy": "比较两个月工资单上的岗位数量，不是数当月发出了多少份招聘广告。",
          "misconception": "岗位数不等于就业人数；失业率来自另一项调查，不能把两者直接相减。",
          "sourceIds": [
            "bls-method"
          ]
        },
        {
          "term": "国债收益率",
          "id": "yield",
          "short": "国债到期收益率",
          "definition": "结合债券价格、利息和到期还本计算的年化收益尺度，具体口径要看数据说明。",
          "analogy": "同一套固定租金的房子，买入价格不同，回报比例也不同。",
          "misconception": "对其他条件不变的固定利率债券，价格下跌通常对应收益率上升，不是债券持有人已经赚得更多。",
          "sourceIds": []
        },
        {
          "term": "成交额",
          "id": "turnover",

    "glossary": [
      {
        "term": "PMI",
        "id": "pmi",
        "short": "采购经理指数",
        "definition": "通过采购经理月度调查形成的景气指数。高于50表示总体较上月扩张，低于50表示收缩。",
        "analogy": "像经济活动的月度温度计，记录企业反馈的变化方向。",
        "misconception": "50.1不是经济增长了50.1%；9月调查也不能证明9月底刚公布政策已经生效。",

        ]
      },
      {
        "term": "PSL",
        "id": "psl",
        "short": "抵押补充贷款",
        "definition": "央行向政策性银行提供的资金工具，用于支持指定领域。",
        "analogy": "像给承担特定项目的机构一条专用融资通道。",
        "misconception": "PSL降息不等于所有人的存款、房贷利率同步下降。",
        "sourceIds": [
          "pboc-20260929"
        ]
      },
      {
        "term": "再贷款",
        "id": "relending",
        "short": "央行向金融机构提供的贷款",
        "definition": "央行向金融机构提供资金，部分工具用于引导银行向指定领域贷款。",
        "analogy": "银行向上游融资，再为符合条件的企业提供贷款。",
        "misconception": "资金支持不是补贴本金；企业需要还款，银行仍要评估和承担相应信用风险。",
        "sourceIds": [
          "pboc-tools",
          "pboc-20260929"
        ]
      },
      {
        "term": "基点",
        "id": "basis-point",
        "short": "Basis point，BP",
        "definition": "1个基点等于0.01个百分点；25个基点等于0.25个百分点。",
        "analogy": "就像用厘米描述一小段距离，基点用来描述细小的利率变化。",
        "misconception": "1.75%降至1.50%是下降25个基点，不是下降25%。",
        "sourceIds": []
      },
      {
        "term": "额度",
        "id": "quota",
        "short": "政策工具的可用规模",
        "definition": "某项工具可使用的规模上限；实际用出去多少，要看执行数据。",
        "analogy": "获批的预算，不等于已经付款的账单。",
        "misconception": "额度增加2000亿元，不等于当天新增贷款或到账资金就有2000亿元。",
        "sourceIds": [
          "pboc-20260929"
        ]
      },
      {
        "term": "PCE价格指数",
        "id": "pce",
        "short": "个人消费支出价格指数",
        "definition": "衡量美国居民购买商品和服务价格变化的指标。核心PCE剔除食品和能源。",
        "analogy": "跟踪一篮子生活开支的价格，而不是只看今天买的一件商品。",
        "misconception": "PCE支出金额与PCE价格指数不同；涨价放慢，也不一定意味着价格下降。",

        "analogy": "比较两个月工资单上的岗位数量，不是数当月发出了多少份招聘广告。",
        "misconception": "岗位数不等于就业人数；失业率来自另一项调查，不能把两者直接相减。",

        "analogy": "商场今天卖了多少钱，不能单凭它判断每个顾客还有多少存款。",
